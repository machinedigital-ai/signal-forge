<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Forge</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --ink: #101010;
      --muted: #66645f;
      --line: #d9d7d1;
      --red: #e10600;
      --blue: #064df6;
      --amber: #f5a400;
      --green: #16803c;
      --shadow: 0 18px 60px rgba(16, 16, 16, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(6, 77, 246, 0.12);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 68px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--red) 0 46%, transparent 47% 53%, var(--red) 54%);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 1.1fr) minmax(300px, 1fr) minmax(320px, 1.2fr) minmax(260px, 0.8fr);
      min-height: calc(100vh - 68px);
    }

    .col {
      padding: 24px 20px;
      border-right: 1px solid var(--line);
    }

    .col:last-child {
      border-right: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: 900;
    }

    .step {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      margin-right: 9px;
      border-radius: 5px;
      background: #050505;
      color: #fff;
      font-size: 13px;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .editor {
      min-height: 560px;
      padding: 20px;
      resize: vertical;
      font: 16px/1.62 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      box-shadow: inset 0 1px 0 rgba(16, 16, 16, 0.03);
    }

    .primary {
      width: 100%;
      margin-top: 16px;
      padding: 16px 18px;
      border-color: #050505;
      background: #050505;
      color: #fff;
      box-shadow: var(--shadow);
    }

    .primary.blue {
      border-color: var(--blue);
      background: var(--blue);
    }

    .ghost {
      padding: 9px 12px;
      font-size: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 0.8fr 1fr;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .score {
      display: grid;
      place-items: center;
      min-height: 145px;
      border-right: 1px solid var(--line);
    }

    .score-number {
      font-size: 52px;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }

    .breakdown {
      display: grid;
      align-content: center;
      gap: 10px;
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 999px;
      background: var(--red);
    }

    .dot.amber {
      background: var(--amber);
    }

    .dot.green {
      background: var(--green);
    }

    .flag-list {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
    }

    .flag {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .flag:last-child {
      border-bottom: 0;
    }

    .flag strong {
      color: var(--red);
    }

    .highlighted {
      min-height: 180px;
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      white-space: pre-wrap;
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    mark {
      border-radius: 3px;
      background: #ffe0df;
      color: inherit;
      padding: 0 2px;
    }

    .rewrite-box {
      min-height: 560px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      white-space: pre-wrap;
      font: 16px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .compare {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .compare .rewrite-box {
      min-height: 420px;
      font-size: 13px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    .field textarea {
      min-height: 92px;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
    }

    .field input, .field select {
      height: 38px;
      padding: 0 10px;
    }

    .persona-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .persona-card h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .persona-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row > * {
      flex: 1;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .footer {
      position: fixed;
      right: 18px;
      bottom: 14px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 12px;
      box-shadow: var(--shadow);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr 1fr;
      }

      .col {
        border-bottom: 1px solid var(--line);
      }
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        height: auto;
        padding: 14px;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .col {
        border-right: 0;
      }

      .metrics, .compare {
        grid-template-columns: 1fr;
      }

      .score {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"></span> Signal Forge</div>
    <div class="top-actions">
      <span id="ollamaStatus">Checking Ollama...</span>
      <select id="modelSelect" aria-label="Ollama model"></select>
      <button class="ghost" id="copyRewrite">Copy rewrite</button>
    </div>
  </header>

  <main class="layout">
    <section class="col">
      <div class="section-title">
        <span><span class="step">1</span>Source Text</span>
        <button class="ghost" id="clearText">Clear</button>
      </div>
      <div class="small"><span id="charCount">0</span> characters</div>
      <textarea id="sourceText" class="editor" spellcheck="true"></textarea>
      <button class="primary" id="scanButton">Scan for AI Cliches</button>
      <p class="status">Paste writing, scan it, pick a persona, then rewrite through Ollama or the local fallback.</p>
    </section>

    <section class="col">
      <div class="section-title">
        <span><span class="step">2</span>Review</span>
        <button class="ghost" id="exportReport">Export</button>
      </div>
      <div class="metrics">
        <div class="score">
          <div>
            <div class="score-number"><span id="score">0</span><span class="small">/100</span></div>
            <div class="small" id="scoreLabel">No scan yet</div>
          </div>
        </div>
        <div class="breakdown" id="breakdown"></div>
      </div>
      <div class="highlighted" id="highlightedText">Flagged phrases will appear here.</div>
      <div class="flag-list" id="flagList"></div>
    </section>

    <section class="col">
      <div class="section-title">
        <span><span class="step">3</span>Rewrite Preview</span>
        <button class="ghost" id="toggleCompare">Side by side</button>
      </div>
      <div id="rewriteArea" class="rewrite-box">Your revision will appear here.</div>
      <button class="primary blue" id="rewriteButton">Rewrite with Selected Persona</button>
      <p class="status" id="rewriteStatus">Ready.</p>
    </section>

    <aside class="col">
      <div class="section-title">
        <span><span class="step">4</span>Persona</span>
        <button class="ghost" id="savePersona">Save</button>
      </div>
      <div class="field">
        <label for="personaSelect">Choose vibe</label>
        <select id="personaSelect"></select>
      </div>
      <div class="persona-card" id="personaSummary"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
      <div class="field">
        <label for="personaName">Create persona</label>
        <input id="personaName" maxlength="40" placeholder="e.g. Streetwise Founder">
      </div>
      <div class="field">
        <label for="personaDescription">Persona instructions</label>
        <textarea id="personaDescription" maxlength="500" placeholder="Write how this voice thinks, sounds, and refuses to sound."></textarea>
      </div>
      <div class="field">
        <label for="avoidList">Banned phrases</label>
        <textarea id="avoidList" placeholder="one phrase per line"></textarea>
      </div>
    </aside>
  </main>

  <div class="footer" id="autosave">Local draft autosaved</div>

  <script src="engine.js"></script>
  <script>
    const sampleText = `The real danger of shunning AI isn't the technology itself-it's the complacency it exposes.

For too long, we've treated tools like AI as optional luxuries for the overworked or the desperate. But here's the truth: avoiding them is a choice with consequences. It's not about whether you can use AI-it's about whether you can afford not to. The teams that ignore it won't just fall behind; they'll start losing fights before they even notice.

Consider what happens when you refuse to integrate AI into your workflow:
You outsource more hours to manual labor.
Your margin for error grows with every human step in a process.
Someone else, somewhere, is already shipping faster and cheaper because they didn't wait for permission to optimize.

The danger isn't the robot. It's the delusion that you're special enough to stay untouched by automation. The world doesn't reward mediocre systems built by hand. It rewards the ones that evolve. And evolution requires more than stubbornness-it demands curiosity about how to leverage what's already here.`;

    const {
      archetypes: basePersonas,
      buildPrompt,
      fallbackRewrite,
      judgeRewrite,
      scanText,
      scoreFlags
    } = SignalForgeEngine;

    const $ = (id) => document.getElementById(id);
    let personas = JSON.parse(localStorage.getItem("signalForgePersonas") || "null") || basePersonas;
    basePersonas.forEach((basePersona) => {
      if (!personas.some((persona) => persona.name === basePersona.name)) personas.push(basePersona);
    });
    let lastFlags = [];
    let compare = false;

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function currentPersona() {
      return personas[$("personaSelect").selectedIndex] || personas[0];
    }

    function renderPersonas() {
      $("personaSelect").innerHTML = personas.map((persona) => `<option>${escapeHtml(persona.name)}</option>`).join("");
      renderPersonaSummary();
    }

    function renderPersonaSummary() {
      const persona = currentPersona();
      $("personaSummary").innerHTML = `<h3>${escapeHtml(persona.name)}</h3><p>${escapeHtml(persona.description)}</p>`;
      $("avoidList").value = persona.banned || "";
    }

    function renderScan(flags) {
      const score = scoreFlags(flags);
      const high = flags.filter((flag) => flag.weight >= 80).length;
      const medium = flags.filter((flag) => flag.weight >= 55 && flag.weight < 80).length;
      const mild = flags.length - high - medium;
      $("score").textContent = score;
      $("scoreLabel").textContent = score > 70 ? "Heavy AI/cliche scent" : score > 35 ? "Mixed voice" : "Mostly clean";
      $("breakdown").innerHTML = `
        <div><span class="dot"></span>High cliche <strong>${high}</strong></div>
        <div><span class="dot amber"></span>Moderate cliche <strong>${medium}</strong></div>
        <div><span class="dot green"></span>Mild cliche <strong>${mild}</strong></div>
        <div>Total flags <strong>${flags.length}</strong></div>
      `;
      $("flagList").innerHTML = flags.length
        ? flags.map((flag) => `<div class="flag"><span class="dot ${flag.weight >= 80 ? "" : "amber"}"></span><span>${escapeHtml(flag.phrase)}</span><strong>${flag.weight}</strong></div>`).join("")
        : `<div class="flag"><span class="dot green"></span><span>No known cliches found.</span><strong>0</strong></div>`;

      const pattern = flags.map((flag) => flag.phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
      $("highlightedText").innerHTML = pattern
        ? escapeHtml($("sourceText").value).replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>")
        : escapeHtml($("sourceText").value || "Nothing to highlight.");
    }

    async function rewrite() {
      const text = $("sourceText").value.trim();
      if (!text) return;
      const persona = currentPersona();
      const model = $("modelSelect").value;
      $("rewriteStatus").textContent = model ? `Asking Ollama (${model})...` : "Ollama unavailable. Using local fallback.";
      $("rewriteButton").disabled = true;
      try {
        if (!model) throw new Error("No Ollama model selected");
        const response = await fetch("http://localhost:11434/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model, prompt: buildPrompt(text, persona, lastFlags), stream: false })
        });
        if (!response.ok) throw new Error(`Ollama returned ${response.status}`);
        const data = await response.json();
        renderRewrite((data.response || "").trim() || fallbackRewrite(text, persona));
        $("rewriteStatus").textContent = "Rewritten through Ollama.";
      } catch (error) {
        renderRewrite(fallbackRewrite(text, persona));
        $("rewriteStatus").textContent = `${error.message}. Used local fallback.`;
      } finally {
        $("rewriteButton").disabled = false;
      }
    }

    function renderRewrite(text) {
      if (compare) {
        $("rewriteArea").className = "compare";
        $("rewriteArea").innerHTML = `<div class="rewrite-box">${escapeHtml($("sourceText").value)}</div><div class="rewrite-box">${escapeHtml(text)}</div>`;
      } else {
        $("rewriteArea").className = "rewrite-box";
        $("rewriteArea").textContent = text;
      }
      localStorage.setItem("signalForgeRewrite", text);
    }

    async function loadModels() {
      try {
        const response = await fetch("http://localhost:11434/api/tags");
        if (!response.ok) throw new Error("Ollama is not responding");
        const data = await response.json();
        const models = (data.models || [])
          .filter((model) => !model.capabilities || model.capabilities.includes("completion"))
          .map((model) => model.name);
        $("modelSelect").innerHTML = models.map((name) => `<option>${escapeHtml(name)}</option>`).join("");
        $("ollamaStatus").textContent = models.length ? "Ollama connected" : "Ollama connected, no models found";
      } catch {
        $("modelSelect").innerHTML = "";
        $("ollamaStatus").textContent = "Ollama not detected";
      }
    }

    function saveDraft() {
      localStorage.setItem("signalForgeText", $("sourceText").value);
      $("charCount").textContent = $("sourceText").value.length.toLocaleString();
      $("autosave").textContent = `Local draft autosaved ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    }

    $("scanButton").addEventListener("click", () => {
      lastFlags = scanText($("sourceText").value);
      renderScan(lastFlags);
    });
    $("rewriteButton").addEventListener("click", rewrite);
    $("sourceText").addEventListener("input", saveDraft);
    $("personaSelect").addEventListener("change", renderPersonaSummary);
    $("toggleCompare").addEventListener("click", () => {
      compare = !compare;
      renderRewrite(localStorage.getItem("signalForgeRewrite") || "Your revision will appear here.");
    });
    $("clearText").addEventListener("click", () => {
      $("sourceText").value = "";
      saveDraft();
    });
    $("copyRewrite").addEventListener("click", async () => {
      await navigator.clipboard.writeText($("rewriteArea").innerText);
    });
    $("savePersona").addEventListener("click", () => {
      const name = $("personaName").value.trim();
      const description = $("personaDescription").value.trim();
      if (!name || !description) return;
      personas.push({ name, description, banned: $("avoidList").value.trim() });
      localStorage.setItem("signalForgePersonas", JSON.stringify(personas));
      renderPersonas();
      $("personaSelect").selectedIndex = personas.length - 1;
      renderPersonaSummary();
      $("personaName").value = "";
      $("personaDescription").value = "";
    });
    $("exportReport").addEventListener("click", () => {
      const report = `Signal Forge Report\n\nScore: ${$("score").textContent}/100\nFlags:\n${lastFlags.map((flag) => `- ${flag.phrase} (${flag.weight})`).join("\n")}`;
      const url = URL.createObjectURL(new Blob([report], { type: "text/plain" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "signal-forge-report.txt";
      link.click();
      URL.revokeObjectURL(url);
    });

    $("sourceText").value = localStorage.getItem("signalForgeText") || sampleText;
    renderPersonas();
    saveDraft();
    lastFlags = scanText($("sourceText").value);
    renderScan(lastFlags);
    renderRewrite(localStorage.getItem("signalForgeRewrite") || fallbackRewrite($("sourceText").value, currentPersona()));
    loadModels();
  </script>
</body>
</html>
